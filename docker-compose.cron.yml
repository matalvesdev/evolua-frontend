# Docker Compose for scheduled cron jobs
# Runs alongside the main services to handle:
# - Daily DB health check at 06:17 UTC (03:17 São Paulo)
# - Newsletter dispatch on Wednesday at 13:00 UTC (10:00 São Paulo)
#
# Cron expressions are written in UTC (container uses UTC); the local
# time above is informational only. Do NOT set a TZ env — it would skew
# crond away from the expected UTC schedule.
#
# Content pipeline & weekly engine run via GitHub Actions (.github/workflows/content-pipeline.yml)
#
# Usage: docker compose -f docker-compose.cron.yml up -d

services:
  cron:
    image: node:20-alpine
    container_name: evolua-cron
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts:ro
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-noreply@useevolua.com.br}
      - SENTRY_DSN=${SENTRY_DSN}
    entrypoint: |
      sh -c '
        echo "17 6 * * * node /scripts/db-healthcheck.js" > /etc/crontabs/root
        echo "0 13 * * 3 node /scripts/send-newsletter.js" >> /etc/crontabs/root
        crond -f -l 2
      '
    networks:
      - evolua_net

networks:
  evolua_net:
    external: true
