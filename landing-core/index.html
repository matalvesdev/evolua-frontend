<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Security headers -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; frame-ancestors 'none';" />

    <!-- Canonical & theme -->
    <link rel="canonical" href="https://evolua.app" />
    <meta name="theme-color" content="#F8F8FF" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary meta -->
    <title>EVOLUA | Agenda Cheia e Gestão de Elite para Fonoaudiólogas</title>
    <meta name="description" content="A plataforma feita para fonoaudiólogas extraordinárias. Agenda cheia, pacientes novos, IA e gestão em um só lugar. Teste grátis por 7 dias." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://evolua.app" />
    <meta property="og:title" content="EVOLUA | Agenda Cheia e Gestão de Elite para Fonoaudiólogas" />
    <meta property="og:description" content="A plataforma feita para fonoaudiólogas extraordinárias. Agenda cheia, pacientes novos, IA e gestão em um só lugar." />
    <meta property="og:image" content="https://evolua.app/og-image.jpg" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Evolua" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EVOLUA | Agenda Cheia e Gestão de Elite para Fonoaudiólogas" />
    <meta name="twitter:description" content="A plataforma feita para fonoaudiólogas extraordinárias. Agenda cheia, pacientes novos, IA e gestão em um só lugar." />
    <meta name="twitter:image" content="https://evolua.app/og-image.jpg" />

    <!-- Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />

      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
