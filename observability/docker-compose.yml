services:
  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports: ['3000:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus', '--web.enable-lifecycle']
    ports: ['9090:9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus-data:/prometheus
  loki:
    image: grafana/loki:3.5.5
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports: ['3100:3100']
  tempo:
    image: grafana/tempo:2.8.2
    command: ['-config.file=/etc/tempo.yaml']
    ports: ['4318:4318', '3200:3200']
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
volumes:
  grafana-data:
  prometheus-data:
