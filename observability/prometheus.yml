global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: evolua-api
    scheme: https
    metrics_path: /metrics
    http_headers:
      X-Internal-Token:
        values: ['${EVOLUA_INTERNAL_SERVICE_TOKEN}']
    static_configs:
      - targets: ['api.useevolua.com.br']
