name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe your suggested implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Other options you considered.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Mockups, references, links, or constraints.
    validations:
      required: false
