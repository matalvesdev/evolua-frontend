name: Bug report
description: Report a reproducible bug
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Description
      description: Clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Provide step-by-step reproduction instructions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Browser, OS, branch, and relevant versions.
    validations:
      required: false
