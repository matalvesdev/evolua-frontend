name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Backend Fastify + contracts (TS) — typecheck + tests
  # ────────────────────────────────────────────────────────────────────
  backend-ts:
    name: Backend (TS) typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend-core/package-lock.json
      - run: npm ci
      - name: Build contracts (Zod source of truth)
        run: npm run build -w contracts
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck api
        run: npx tsc --noEmit -p apps/api/tsconfig.json
      - name: Tests (Vitest)
        run: npm test --workspace=apps/api --if-present

  # ────────────────────────────────────────────────────────────────────
  # AI service (Python / FastAPI)
  # ────────────────────────────────────────────────────────────────────
  ai-python:
    name: AI service (Python) lint + import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core/apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check app
      - name: Mypy strict
        run: mypy app
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────
  # WhatsApp service (Go)
  # ────────────────────────────────────────────────────────────────────
  whatsapp-go:
    name: WhatsApp service (Go) build + vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core/apps/services/whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend-core/apps/services/whatsapp/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1
        continue-on-error: true # remover quando houver testes

  # ────────────────────────────────────────────────────────────────────
  # Frontend (dashboard SPA)
  # ────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-core/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-core/dist
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────
  # Landing page (marketing)
  # ────────────────────────────────────────────────────────────────────
  landing:
    name: Landing lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: landing-core/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing-core/dist
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────
  # Migration drift — detecta schema.prisma diferente das migrations
  # ────────────────────────────────────────────────────────────────────
  prisma-migrations:
    name: Prisma migrations drift check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend-core/package-lock.json
      - run: npm ci
      - name: Verifica que schema.prisma == migrations aplicadas
        # Aplica todas as migrations no Postgres efêmero e compara com schema.prisma.
        # Sai com 2 se houver drift.
        env:
          SHADOW_DATABASE_URL: postgresql://prisma:prisma@localhost:5432/shadow
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

  # ────────────────────────────────────────────────────────────────────
  # Secret scan — falha em commits com chaves típicas
  # ────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
