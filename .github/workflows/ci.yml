name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # ─── Path detection ───────────────────────────────────────────────
  paths:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      landing: ${{ steps.filter.outputs.landing }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend-core/**'
              - 'pnpm-lock.yaml'
            landing:
              - 'landing-core/**'
              - 'pnpm-lock.yaml'
            scripts:
              - 'scripts/**'
            docs:
              - '.doc/**'
              - '.geos/**'
              - 'docs/**'
              - 'openspec/**'
              - '.github/workflows/ci.yml'

  # ─── Frontend (react + vite + tanstack router) ───────────────────
  frontend-build:
    needs: paths
    if: needs.paths.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (routeTree.gen.ts needed before typecheck)
        run: pnpm -F ./frontend-core build
      - name: TypeCheck
        run: pnpm -F ./frontend-core typecheck
      - name: Lint
        run: pnpm -F ./frontend-core lint

  # ─── Landing (react + vite, no supabase env in CI) ───────────────
  landing-build:
    needs: paths
    if: needs.paths.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 'Build (skip-sitemap - no Supabase env in CI)'
        run: pnpm -F ./landing-core build:skip-sitemap
      - name: TypeCheck
        run: pnpm -F ./landing-core typecheck
      - name: Lint
        run: pnpm -F ./landing-core lint

  # ─── E2E (after builds succeed) ─────────────────────────────────
  e2e:
    needs: [frontend-build, landing-build]
    if: always() && (needs.frontend-build.result == 'success' || needs.landing-build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test

  # ─── Docs & config validation ────────────────────────────────────
  validate-docs:
    needs: paths
    if: needs.paths.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate .doc/ structure
        run: |
          REQUIRED_FILES=(
            ".doc/empresa.md"
            ".doc/cliente.md"
            ".doc/produto.md"
            ".doc/tecnologia.md"
            ".doc/operacao.md"
            ".doc/metricas.md"
            ".doc/roadmap.md"
            ".doc/decisoes.md"
            ".doc/geo-experiment.md"
          )
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required doc: $f"
              exit 1
            fi
          done
          echo "All .doc/ files present"
      - name: Validate .geos/geos.yaml
        run: |
          if [ ! -f ".geos/geos.yaml" ]; then
            echo "::error::Missing .geos/geos.yaml"
            exit 1
          fi
          # Basic YAML syntax check via node
          node -e "
            const fs = require('fs');
            const yaml = fs.readFileSync('.geos/geos.yaml', 'utf8');
            // Check required keys exist
            const required = ['company:', 'storage:', 'knowledge:', 'approvals:'];
            for (const key of required) {
              if (!yaml.includes(key)) {
                console.error('::error::Missing required key in geos.yaml: ' + key);
                process.exit(1);
              }
            }
            console.log('.geos/geos.yaml structure valid');
          "
      - name: Validate GEO experiment
        run: |
          if [ ! -f ".doc/geo-experiment.md" ]; then
            echo "::error::Missing .doc/geo-experiment.md"
            exit 1
          fi
          # Check it has baseline section
          if ! grep -q "## Baseline" ".doc/geo-experiment.md"; then
            echo "::error::GEO experiment missing ## Baseline section"
            exit 1
          fi
          echo "GEO experiment structure valid"
      - name: Validate documentation links
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const docsRoot = 'docs';
          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const resolved = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(resolved);
              if (entry.isFile() && entry.name.endsWith('.md')) files.push(resolved);
            }
          };
          walk(docsRoot);

          const failures = [];
          for (const file of files) {
            const content = fs.readFileSync(file, 'utf8').replace(/`[^`]*`/g, '');
            const linkPattern = /\[[^\]]+\]\(([^)#]+)(?:#[^)]+)?\)/g;
            for (const match of content.matchAll(linkPattern)) {
              const target = match[1].trim().replace(/^<|>$/g, '');
              if (/^(https?:|mailto:)/.test(target)) continue;
              if (!fs.existsSync(path.resolve(path.dirname(file), target))) {
                failures.push(`${file}: ${target}`);
              }
            }
          }

          if (failures.length > 0) {
            console.error(`::error::Broken Markdown links:\n${failures.join('\n')}`);
            process.exit(1);
          }
          console.log(`Markdown links valid (${files.length} files).`);
          NODE

  # ─── Security ────────────────────────────────────────────────────
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  # ─── CI gate (required check) ────────────────────────────────────
  # Only this job should be set as required in branch protection rules.
  # Accepts success or skipped (path-scoped jobs skip when no changes).
  # Fails on failure or cancelled.
  ci-gate:
    if: always()
    needs:
      - paths
      - frontend-build
      - landing-build
      - e2e
      - validate-docs
      - secret-scanning
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        run: |
          echo "Checking results..."
          echo "  paths:            ${{ needs.paths.result }}"
          echo "  frontend-build:   ${{ needs.frontend-build.result }}"
          echo "  landing-build:    ${{ needs.landing-build.result }}"
          echo "  e2e:              ${{ needs.e2e.result }}"
          echo "  validate-docs:    ${{ needs.validate-docs.result }}"
          echo "  secret-scanning:  ${{ needs.secret-scanning.result }}"
          echo "  dependency-review: ${{ needs.dependency-review.result }}"

          if [[ "${{ needs.frontend-build.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-build.result }}" == "cancelled" ]] || \
             [[ "${{ needs.landing-build.result }}" == "failure" ]] || \
             [[ "${{ needs.landing-build.result }}" == "cancelled" ]] || \
             [[ "${{ needs.e2e.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e.result }}" == "cancelled" ]] || \
             [[ "${{ needs.validate-docs.result }}" == "failure" ]] || \
             [[ "${{ needs.validate-docs.result }}" == "cancelled" ]] || \
             [[ "${{ needs.secret-scanning.result }}" == "failure" ]] || \
             [[ "${{ needs.secret-scanning.result }}" == "cancelled" ]] || \
             [[ "${{ needs.dependency-review.result }}" == "failure" ]] || \
             [[ "${{ needs.dependency-review.result }}" == "cancelled" ]]; then
            echo "::error::CI gate FAILED — one or more required jobs failed or were cancelled"
            exit 1
          fi

          echo "CI gate PASSED"
