name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ['main', 'master', 'develop']
    paths:
      - 'frontend-evolua/**'
      - 'backend-evolua/backend-evolua/**'
      - '.github/workflows/ci.yml'
  push:
    branches: ['main', 'master', 'develop']
    paths:
      - 'frontend-evolua/**'
      - 'backend-evolua/backend-evolua/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-evolua
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-evolua/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --ci --passWithNoTests

      - name: Build
        run: npm run build

  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-evolua/backend-evolua
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend-evolua/backend-evolua/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --ci --passWithNoTests

      - name: Build
        run: npm run build
