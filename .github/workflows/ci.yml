name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeCheck landing-core
        run: pnpm -F landing-core typecheck

      - name: TypeCheck frontend-core
        run: pnpm -F frontend-core typecheck

      - name: TypeCheck contracts
        run: pnpm --filter @evolua/contracts build

      - name: TypeCheck API
        run: pnpm --filter @evolua/api build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint landing-core
        run: pnpm -F landing-core lint

      - name: Lint frontend-core
        run: pnpm -F frontend-core lint

      - name: Lint API (backend)
        run: pnpm --filter @evolua/api lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (AI service)
        working-directory: backend-core/apps/ai
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint AI service (ruff)
        working-directory: backend-core/apps/ai
        run: ruff check .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend-core/apps/services/whatsapp/go.sum

      - name: Vet WhatsApp service (go vet)
        working-directory: backend-core/apps/services/whatsapp
        run: go vet ./...

      - name: Build WhatsApp service
        working-directory: backend-core/apps/services/whatsapp
        run: go build ./...

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evolua_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -F backend-core prisma:generate

      - name: Run API unit tests
        run: pnpm --filter @evolua/api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evolua_test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_JWT_SECRET: test-jwt-secret-thats-long-enough-16
          CORS_ORIGINS: http://localhost:5173
          INTERNAL_SERVICE_TOKEN: test-internal-token-8chars
          SENTRY_DSN: https://test@sentry.io/123
          RATE_LIMIT_MAX: "1000"

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @evolua/contracts build

      - name: Build API
        run: pnpm --filter @evolua/api build

      - name: Build landing-core
        run: pnpm -F landing-core build

      - name: Build frontend-core
        run: pnpm -F frontend-core build

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:5173

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
