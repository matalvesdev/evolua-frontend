name: PostgreSQL Backup

on:
  schedule:
    - cron: '0 3 * * 0'   # Domingo 03:00 UTC
  workflow_dispatch:       # Trigger manual

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Install pg_dump
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backup
        run: bash scripts/backup-postgres.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Upload backup to S3
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.PG_BACKUP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PG_BACKUP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.PG_BACKUP_REGION }}
      - name: Copy backup to S3
        env:
          BACKUP_BUCKET: ${{ secrets.PG_BACKUP_BUCKET }}
        run: aws s3 cp backups/postgres/ "s3://${BACKUP_BUCKET}/postgres-backup/" --recursive --only-show-errors
