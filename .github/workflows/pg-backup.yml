name: PostgreSQL Backup

on:
  schedule:
    - cron: '0 3 * * 0'   # Domingo 03:00 UTC
  workflow_dispatch:       # Trigger manual

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pg_dump
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backup
        run: bash scripts/backup-postgres.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Upload backup to S3
        uses: shallwefootball/s3-upload-action@v1
        with:
          aws_key_id: ${{ secrets.PG_BACKUP_AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.PG_BACKUP_SECRET_ACCESS_KEY }}
          aws_bucket: ${{ secrets.PG_BACKUP_BUCKET }}
          source_dir: backups/postgres/
          destination_dir: postgres-backup/
