name: Deploy Prisma migrations

# Executa `prisma migrate deploy` em produção.
# Disparado manualmente OU em push de migrations para main.
#
# Pré-requisitos (Settings → Secrets and variables → Actions):
#   - DATABASE_URL    : Supabase pooler (porta 6543, ?pgbouncer=true)
#   - DIRECT_URL      : Supabase direct (porta 5432) — usado pelo Prisma
#
# Gate: requer aprovação manual via environment "production".

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "DEPLOY" para confirmar'
        required: true
        default: ''
  push:
    branches: [main]
    paths:
      - 'backend-core/prisma/migrations/**'
      - 'backend-core/prisma/schema.prisma'

concurrency:
  group: deploy-migrations-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: prisma migrate deploy (prod)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.useevolua.online
    defaults:
      run:
        working-directory: backend-core
    steps:
      - name: Validate manual confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmação inválida. Digite exatamente 'DEPLOY'."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-core/package-lock.json

      - run: npm ci

      - name: Show pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate status --schema=prisma/schema.prisma || true

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Final status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate status --schema=prisma/schema.prisma
