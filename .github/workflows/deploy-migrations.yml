name: Deploy Prisma migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "DEPLOY" para confirmar'
        required: true
        default: ''
  push:
    branches: [main]
    paths:
      - 'backend-core/prisma/migrations/**'
      - 'backend-core/prisma/schema.prisma'

permissions:
  contents: read

concurrency:
  group: deploy-migrations-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: prisma migrate deploy (prod)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.useevolua.online
    defaults:
      run:
        working-directory: backend-core
    steps:
      - name: Validate manual confirmation
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmação inválida. Digite exatamente 'DEPLOY'."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-core/package-lock.json
      - run: npm ci
      - name: Show pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate status --schema=prisma/schema.prisma || true
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - name: Final status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate status --schema=prisma/schema.prisma
