name: Deploy Landing

on:
  push:
    branches: [main]
    paths:
      - "landing-core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing-core to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://useevolua.com.br

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeCheck
        run: pnpm -F landing-core typecheck

      - name: Lint
        run: pnpm -F landing-core lint

      - name: Build
        run: pnpm -F landing-core build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
          vercel-args: "--prod"
          working-directory: ./landing-core
