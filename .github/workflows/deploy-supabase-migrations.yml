name: Deploy Supabase migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "DEPLOY" para confirmar'
        required: true
        default: ''
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: deploy-supabase-migrations-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: apply supabase SQL migrations (prod)
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Validate manual confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmação inválida. Digite exatamente 'DEPLOY'."
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.DIRECT_URL }}
        run: bash scripts/apply-supabase-migrations.sh
