name: Deploy Supabase migrations

# Aplica os arquivos SQL de supabase/migrations/ no banco de produção.
#
# Diferente do "Deploy Prisma migrations" (que cobre backend-core/prisma/**),
# este workflow cobre as migrations SQL puras versionadas em supabase/migrations/**
# — changelog, RLS, tabelas do blog/RAG, etc.
#
# Estratégia (ver scripts/apply-supabase-migrations.sh):
#   - Mantém um ledger (public._supabase_sql_migrations).
#   - 1ª execução adota o estado atual como baseline (não re-executa nada).
#   - Execuções seguintes aplicam apenas migrations novas, em transação.
#
# Pré-requisito (Settings → Secrets and variables → Actions):
#   - SUPABASE_DB_URL : connection string DIRETA do Postgres (porta 5432)
#
# Gate: environment "production".

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "DEPLOY" para confirmar'
        required: true
        default: ''
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: deploy-supabase-migrations-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: apply supabase SQL migrations (prod)
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Validate manual confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmação inválida. Digite exatamente 'DEPLOY'."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/apply-supabase-migrations.sh
