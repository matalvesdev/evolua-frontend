name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend-core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend-core to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.useevolua.com.br

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeCheck
        run: pnpm -F ./frontend-core typecheck

      - name: Lint
        run: pnpm -F ./frontend-core lint

      - name: Build
        run: pnpm -F ./frontend-core build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          vercel-args: "--prod"
          working-directory: ./frontend-core
