name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend-core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: false

env:
  PNPM_VERSION: 9
  NODE_VERSION: 22

jobs:
  deploy:
    name: Deploy frontend-core to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.useevolua.com.br
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (routeTree.gen.ts first)
        run: pnpm -F ./frontend-core build
      - name: TypeCheck
        run: pnpm -F ./frontend-core typecheck
      - name: Lint
        run: pnpm -F ./frontend-core lint
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-version: latest
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          vercel-args: "--prod"
          working-directory: ./frontend-core
