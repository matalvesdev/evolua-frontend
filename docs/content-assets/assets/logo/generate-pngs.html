<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 40px; background: #F8F8FF; }
    .logo-row { display: flex; gap: 40px; flex-wrap: wrap; padding: 20px; }
    .logo-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .logo-label { font-family: sans-serif; font-size: 11px; color: #8888AA; text-transform: uppercase; letter-spacing: 1.5px; }
    svg { display: block; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Lockup Dark → evolua-lockup-dark.png -->
  <div id="lockup-dark" style="padding:0; background:#2D2B55; display:flex; align-items:center; gap:18px; width:600px; height:120px;">
    <svg width="104" height="104" viewBox="0 0 24 24" style="margin:8px; flex-shrink:0;">
      <rect width="24" height="24" fill="#2D2B55"/>
      <g fill="#C4F135">
        <rect x="3" y="10" width="2" height="4" rx="1"/>
        <rect x="7" y="5"  width="2" height="14" rx="1"/>
        <rect x="11" y="2"  width="2" height="20" rx="1"/>
        <rect x="15" y="5"  width="2" height="14" rx="1"/>
        <rect x="19" y="10" width="2" height="4" rx="1"/>
      </g>
    </svg>
    <div style="display:flex; flex-direction:column;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:44px; line-height:1; letter-spacing:0.12em; color:#FFFFFF; text-transform:uppercase;">EVOLUA</div>
      <div style="font-size:9px; letter-spacing:3px; color:#9D97F5; text-transform:uppercase;">gestão para fonoaudiólogas</div>
    </div>
  </div>

  <!-- Lockup Light → evolua-lockup-light.png -->
  <div id="lockup-light" style="padding:0; background:#F8F8FF; display:flex; align-items:center; gap:18px; width:600px; height:120px;">
    <svg width="104" height="104" viewBox="0 0 24 24" style="margin:8px; flex-shrink:0;">
      <rect width="24" height="24" fill="#2D2B55"/>
      <g fill="#C4F135">
        <rect x="3" y="10" width="2" height="4" rx="1"/>
        <rect x="7" y="5"  width="2" height="14" rx="1"/>
        <rect x="11" y="2"  width="2" height="20" rx="1"/>
        <rect x="15" y="5"  width="2" height="14" rx="1"/>
        <rect x="19" y="10" width="2" height="4" rx="1"/>
      </g>
    </svg>
    <div style="display:flex; flex-direction:column;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:44px; line-height:1; letter-spacing:0.12em; color:#1A1A2E; text-transform:uppercase;">EVOLUA</div>
      <div style="font-size:9px; letter-spacing:3px; color:#9D97F5; text-transform:uppercase;">gestão para fonoaudiólogas</div>
    </div>
  </div>

  <!-- Symbol Deep → evolua-symbol-deep.png (512x512) -->
  <div id="symbol-deep" style="width:512px; height:512px; background:#2D2B55; display:flex; align-items:center; justify-content:center;">
    <svg width="360" height="360" viewBox="0 0 24 24">
      <g fill="#C4F135">
        <rect x="3" y="10" width="2" height="4" rx="1"/>
        <rect x="7" y="5"  width="2" height="14" rx="1"/>
        <rect x="11" y="2"  width="2" height="20" rx="1"/>
        <rect x="15" y="5"  width="2" height="14" rx="1"/>
        <rect x="19" y="10" width="2" height="4" rx="1"/>
      </g>
    </svg>
  </div>

  <!-- Symbol Primary → evolua-symbol-primary.png (512x512) -->
  <div id="symbol-primary" style="width:512px; height:512px; background:#F8F8FF; display:flex; align-items:center; justify-content:center;">
    <svg width="360" height="360" viewBox="0 0 24 24">
      <g fill="#6C63FF">
        <rect x="3" y="10" width="2" height="4" rx="1"/>
        <rect x="7" y="5"  width="2" height="14" rx="1"/>
        <rect x="11" y="2"  width="2" height="20" rx="1"/>
        <rect x="15" y="5"  width="2" height="14" rx="1"/>
        <rect x="19" y="10" width="2" height="4" rx="1"/>
      </g>
    </svg>
  </div>

  <!-- Small Lockup → evolua-lockup-small.png (240x48) -->
  <div id="lockup-small" style="padding:0; background:#2D2B55; display:flex; align-items:center; gap:10px; width:240px; height:48px;">
    <svg width="40" height="40" viewBox="0 0 24 24" style="margin:4px; flex-shrink:0;">
      <rect width="24" height="24" fill="#2D2B55"/>
      <g fill="#C4F135">
        <rect x="3" y="10" width="2" height="4" rx="1"/>
        <rect x="7" y="5"  width="2" height="14" rx="1"/>
        <rect x="11" y="2"  width="2" height="20" rx="1"/>
        <rect x="15" y="5"  width="2" height="14" rx="1"/>
        <rect x="19" y="10" width="2" height="4" rx="1"/>
      </g>
    </svg>
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; line-height:1; letter-spacing:0.12em; color:#FFFFFF; text-transform:uppercase;">EVOLUA</div>
  </div>
</body>
</html>
