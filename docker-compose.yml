# ============================================================================
# docker-compose.yml — Evolua CRM (ambiente local / dev)
# ============================================================================
# Stack:
#   - evolution-api     : WhatsApp gateway (Node.js, open-source) — porta 8080
#   - evolution-redis   : Cache do Evolution
#   - evolution-db      : PostgreSQL 16 dedicado (porta 5433)
#
# Setup inicial (Windows PowerShell — gera segredos):
#   $env:EVOLUTION_API_KEY        = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 48 | % {[char]$_})
#   $env:EVOLUTION_WEBHOOK_SECRET = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 48 | % {[char]$_})
#   $env:EVOLUTION_DB_PASSWORD    = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 24 | % {[char]$_})
#
# Subir:
#   docker compose up -d
#
# Criar instância (usa AUTHENTICATION_API_KEY):
#   curl -X POST http://localhost:8080/instance/create `
#        -H "apikey: $env:EVOLUTION_API_KEY" `
#        -H "Content-Type: application/json" `
#        -d '{"instanceName":"evolua","integration":"WHATSAPP-BAILEYS","qrcode":true}'
#
# Conectar (mostra QR base64):
#   curl http://localhost:8080/instance/connect/evolua -H "apikey: $env:EVOLUTION_API_KEY"
#
# Notas:
#   - O backend Evolua valida HMAC-SHA256 dos webhooks recebidos usando
#     EVOLUTION_WEBHOOK_SECRET (ver apps/api/src/config/env.ts).
#   - O evolution-api NÃO assina webhooks nativamente — a verificação HMAC é
#     feita por proxy/middleware do nosso backend ou por configuração custom.
# ============================================================================

services:

  # ── Evolution API (WhatsApp gateway, open-source) ───────────────────────────
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: evolua_evolution_api
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # ─ Servidor ─
      SERVER_TYPE: http
      SERVER_PORT: '8080'
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8080}

      # ─ Autenticação ─
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'

      # ─ Database (Postgres) ─
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evogo:${EVOLUTION_DB_PASSWORD:-evogo_secret}@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolua_exchange
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'

      # ─ Cache (Redis) ─
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolua
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'

      # ─ Webhook global → backend Evolua ─
      WEBHOOK_GLOBAL_ENABLED: 'true'
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_URL:-http://host.docker.internal:3000/api/wa-crm/webhook}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: 'false'
      WEBHOOK_EVENTS_QRCODE_UPDATED: 'true'
      WEBHOOK_EVENTS_CONNECTION_UPDATE: 'true'
      WEBHOOK_EVENTS_MESSAGES_UPSERT: 'true'
      WEBHOOK_EVENTS_MESSAGES_UPDATE: 'true'
      WEBHOOK_EVENTS_SEND_MESSAGE: 'true'
      WEBHOOK_EVENTS_CONTACTS_UPSERT: 'true'

      # ─ Sessão / QR ─
      CONFIG_SESSION_PHONE_CLIENT: Evolua CRM
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: '30'
      DEL_INSTANCE: 'false'

      # ─ Logs ─
      LOG_LEVEL: ERROR,WARN,INFO,WEBHOOKS
      LOG_COLOR: 'true'
      LOG_BAILEYS: error
      EVENT_EMITTER_MAX_LISTENERS: '50'

      # ─ Telemetry off ─
      TELEMETRY_ENABLED: 'false'
      LANGUAGE: pt-BR
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    networks:
      - evolua_net
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── PostgreSQL para Evolution API ──────────────────────────────────────────
  evolution-db:
    image: postgres:16-alpine
    container_name: evolua_evolution_db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: evogo
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evogo_secret}
      POSTGRES_DB: evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - evolua_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evogo -d evolution']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  evolution-redis:
    image: redis:7-alpine
    container_name: evolua_evolution_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - evolution_redis_data:/data
    networks:
      - evolua_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolution_db_data:
  evolution_redis_data:

networks:
  evolua_net:
    driver: bridge
