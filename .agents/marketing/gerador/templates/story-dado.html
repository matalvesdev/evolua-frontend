<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #F8F8FF;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Barra violet superior */
  .top-bar {
    height: 8px;
    background: #6C63FF;
    flex-shrink: 0;
  }

  /* Logo */
  .logo {
    padding: 64px 80px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .logo-dot {
    width: 16px;
    height: 16px;
    background: #6C63FF;
  }

  .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #6C63FF;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Área de dado central */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 80px;
    text-align: center;
    gap: 48px;
  }

  /* Contexto / label acima do dado */
  .contexto {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 600;
    color: #4A4A6A;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* Card de dado */
  .dado-card {
    background: #2D2B55;
    border-radius: 2px;
    padding: 80px 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 900px;
    position: relative;
    overflow: hidden;
  }

  /* Linha violet no card */
  .dado-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: #6C63FF;
  }

  .dado-numero {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 200px;
    font-weight: 900;
    line-height: 0.9;
    color: #C4F135;
    letter-spacing: -8px;
  }

  .dado-unidade {
    font-family: 'DM Sans', sans-serif;
    font-size: 40px;
    font-weight: 500;
    color: rgba(245,240,255,0.80);
    margin-top: 16px;
    line-height: 1.4;
    max-width: 700px;
  }

  /* Descrição abaixo do card */
  .descricao {
    font-family: 'DM Sans', sans-serif;
    font-size: 36px;
    font-weight: 400;
    line-height: 1.5;
    color: #1A1A2E;
    max-width: 860px;
  }

  /* Rodapé */
  .footer {
    padding: 0 80px 80px;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }

  .arroba {
    font-family: 'DM Sans', sans-serif;
    font-size: 26px;
    font-weight: 500;
    color: #4A4A6A;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>

  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">Evolua</span>
  </div>

  <div class="main">
    <span class="contexto">sabia que...</span>
    <div class="dado-card">
      <span class="dado-numero">{{DADO}}</span>
      <span class="dado-unidade">{{UNIDADE}}</span>
    </div>
    <p class="descricao">{{CORPO}}</p>
  </div>

  <div class="footer">
    <span class="arroba">{{ARROBA}}</span>
  </div>
</body>
</html>
