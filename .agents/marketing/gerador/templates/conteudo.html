<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #F8F8FF;
    color: #2D2B55;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Barra violet superior */
  .top-bar {
    height: 6px;
    background: #6C63FF;
    flex-shrink: 0;
  }

  /* Header */
  .header {
    padding: 36px 60px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .slide-pill {
    background: #6C63FF;
    color: #F8F8FF;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    padding: 6px 18px;
    border-radius: 2px;
    letter-spacing: 0.5px;
  }

  .arroba {
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 500;
    color: #6C63FF;
  }

  /* Área principal */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 36px 60px;
  }

  /* Título */
  .titulo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 56px;
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -1.5px;
    color: #2D2B55;
    margin-bottom: 28px;
  }

  /* Divisor violet */
  .divisor {
    width: 56px;
    height: 4px;
    background: #6C63FF;
    border-radius: 0;
    margin-bottom: 28px;
  }

  /* Corpo do texto */
  .corpo {
    font-family: 'DM Sans', sans-serif;
    font-size: 32px;
    font-weight: 400;
    line-height: 1.6;
    color: #1A1A2E;
    white-space: pre-line;
  }

  .corpo strong {
    color: #6C63FF;
    font-weight: 700;
  }

  /* Fonte científica */
  .fonte {
    margin-top: 32px;
    padding: 18px 22px;
    background: rgba(124,58,237,0.08);
    border-left: 4px solid #6C63FF;
    border-radius: 0;
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 500;
    color: #6C63FF;
    line-height: 1.5;
  }

  /* Rodapé */
  .footer {
    padding: 0 60px 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .evolua-tag {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #6C63FF;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .slide-count {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 400;
    color: #4A4A6A;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>

  <div class="header">
    <span class="slide-pill">{{NUMERO}}</span>
    <span class="arroba">{{ARROBA}}</span>
  </div>

  <div class="main">
    <h2 class="titulo">{{TITULO}}</h2>
    <div class="divisor"></div>
    <div class="corpo">{{CORPO}}</div>
    {{FONTE}}
  </div>

  <div class="footer">
    <span class="evolua-tag">Evolua</span>
    <span class="slide-count">{{NUMERO}} de {{TOTAL}}</span>
  </div>
</body>
</html>
