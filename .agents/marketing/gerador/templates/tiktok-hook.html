<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #2D2B55;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Glow profundo */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 75%, rgba(124,58,237,0.35) 0%, transparent 55%);
    pointer-events: none;
  }

  /* Barra violet inferior — "câmera" TikTok fica em cima, info fica embaixo */
  .accent-bottom {
    position: absolute;
    left: 0;
    bottom: 0;
    right: 0;
    height: 6px;
    background: #6C63FF;
  }

  /* Logo canto superior esquerdo */
  .logo {
    position: absolute;
    top: 72px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }

  .logo-dot {
    width: 14px;
    height: 14px;
    background: #6C63FF;
  }

  .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #9D97F5;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Label TikTok canto superior direito */
  .platform-tag {
    position: absolute;
    top: 72px;
    right: 64px;
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: rgba(167,139,250,0.50);
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 10;
  }

  /* Área do hook — ocupa 60% da tela (zona segura do TikTok) */
  .hook-area {
    position: absolute;
    bottom: 240px;
    left: 64px;
    right: 64px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* Chip de categoria — fúcsia para máximo impacto */
  .chip {
    display: inline-flex;
    align-items: center;
    background: #EAE8FF;
    color: #1A1A2E;
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 2px;
    width: fit-content;
    letter-spacing: 0.3px;
  }

  /* Frase de gancho — grande, impactante */
  .hook-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 100px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -4px;
    color: #F8F8FF;
  }

  /* Subtexto */
  .hook-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 36px;
    font-weight: 400;
    line-height: 1.45;
    color: rgba(167,139,250,0.75);
    max-width: 880px;
  }

  /* Arroba na base */
  .arroba {
    position: absolute;
    bottom: 80px;
    left: 64px;
    font-family: 'DM Sans', sans-serif;
    font-size: 26px;
    font-weight: 500;
    color: rgba(167,139,250,0.50);
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="accent-bottom"></div>

  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">Evolua</span>
  </div>

  <span class="platform-tag">TikTok</span>

  <div class="hook-area">
    <div class="chip">{{BADGE}}</div>
    <h1 class="hook-text">{{TITULO}}</h1>
    <p class="hook-sub">{{SUBTITULO}}</p>
  </div>

  <span class="arroba">{{ARROBA}}</span>
</body>
</html>
