<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #2D2B55;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Glow radial de fundo */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(124,58,237,0.28) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Linha violet lateral esquerda */
  .accent-line {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: #6C63FF;
  }

  /* Logo */
  .logo {
    position: absolute;
    top: 90px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    z-index: 10;
  }

  .logo-dot {
    width: 16px;
    height: 16px;
    background: #6C63FF;
  }

  .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #9D97F5;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Conteúdo */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 80px;
    width: 100%;
    gap: 56px;
    margin-top: 60px;
  }

  /* Ícone */
  .icon-wrap {
    width: 112px;
    height: 112px;
    background: #6C63FF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    border-radius: 2px;
    border: 1px solid #6C63FF;
  }

  /* Título */
  .titulo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 88px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -3px;
    color: #F8F8FF;
    max-width: 900px;
  }

  /* Corpo */
  .corpo {
    font-family: 'DM Sans', sans-serif;
    font-size: 40px;
    font-weight: 400;
    line-height: 1.5;
    color: rgba(167,139,250,0.80);
    max-width: 860px;
  }

  /* Botão — neon sobre violet */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: #C4F135;
    color: #1A1A2E;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 800;
    padding: 26px 60px;
    border-radius: 2px;
    letter-spacing: -0.5px;
  }

  /* Nota abaixo do botão */
  .nota {
    font-family: 'DM Sans', sans-serif;
    font-size: 26px;
    font-weight: 400;
    color: rgba(167,139,250,0.45);
  }

  /* Rodapé */
  .footer {
    position: absolute;
    bottom: 90px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 10;
  }

  .arroba {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 500;
    color: rgba(167,139,250,0.45);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="accent-line"></div>

  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">Evolua</span>
  </div>

  <div class="content">
    <div class="icon-wrap">🎯</div>
    <h2 class="titulo">{{TITULO}}</h2>
    <p class="corpo">{{CORPO}}</p>
    <div class="btn">
      <span>Testar grátis</span>
      <span>→</span>
    </div>
    <span class="nota">useevolua.com.br</span>
  </div>

  <div class="footer">
    <span class="arroba">{{ARROBA}}</span>
  </div>
</body>
</html>
