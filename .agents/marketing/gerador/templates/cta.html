<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #2D2B55;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Glow de fundo */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(124,58,237,0.25) 0%, transparent 65%);
    pointer-events: none;
  }

  /* Linha violet lateral esquerda */
  .accent-line {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: #6C63FF;
  }

  /* Conteúdo central */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 80px 80px 100px;
    width: 100%;
    gap: 40px;
  }

  /* Ícone check */
  .icon-wrap {
    width: 96px;
    height: 96px;
    background: #6C63FF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    border-radius: 2px;
    flex-shrink: 0;
    border: 1px solid #6C63FF;
  }

  /* Texto principal */
  .titulo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 68px;
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -2px;
    color: #F8F8FF;
    max-width: 880px;
  }

  /* Corpo */
  .corpo {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 400;
    line-height: 1.55;
    color: rgba(167,139,250,0.80);
    max-width: 800px;
  }

  /* Botão CTA visual — neon sobre violet escuro */
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #C4F135;
    color: #1A1A2E;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 800;
    padding: 18px 44px;
    border-radius: 2px;
    letter-spacing: -0.5px;
  }

  /* Rodapé */
  .footer {
    position: absolute;
    bottom: 48px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 10;
  }

  .arroba {
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 500;
    color: rgba(167,139,250,0.55);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="accent-line"></div>

  <div class="content">
    <div class="icon-wrap">✓</div>
    <h2 class="titulo">{{TITULO}}</h2>
    <p class="corpo">{{CORPO}}</p>
    <div class="cta-btn">
      <span>{{SUBTITULO}}</span>
      <span>→</span>
    </div>
  </div>

  <div class="footer">
    <span class="arroba">{{ARROBA}}</span>
  </div>
</body>
</html>
