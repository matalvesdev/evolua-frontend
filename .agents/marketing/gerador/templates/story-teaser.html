<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #2D2B55;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Glow radial */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(124,58,237,0.28) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Linha violet lateral esquerda */
  .accent-line {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: #6C63FF;
  }

  /* Logo */
  .logo {
    position: absolute;
    top: 90px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    z-index: 10;
  }

  .logo-dot {
    width: 16px;
    height: 16px;
    background: #6C63FF;
  }

  .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #9D97F5;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Conteúdo central */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    justify-content: center;
    padding: 80px;
    flex: 1;
    gap: 56px;
    margin-top: 140px;
  }

  /* Badge "Novo post" */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #6C63FF;
    color: #F8F8FF;
    font-family: 'DM Sans', sans-serif;
    font-size: 26px;
    font-weight: 600;
    padding: 12px 30px;
    border-radius: 2px;
    letter-spacing: 0.5px;
    border: 1px solid #6C63FF;
  }

  /* Título */
  .titulo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 96px;
    font-weight: 900;
    line-height: 1.03;
    letter-spacing: -3px;
    color: #F8F8FF;
    max-width: 900px;
  }

  /* Corpo */
  .corpo {
    font-family: 'DM Sans', sans-serif;
    font-size: 40px;
    font-weight: 400;
    line-height: 1.5;
    color: rgba(167,139,250,0.80);
    max-width: 860px;
  }

  /* Indicador "arraste" */
  .swipe-hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .swipe-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 24px;
    font-weight: 500;
    color: rgba(167,139,250,0.55);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .swipe-arrow {
    font-size: 36px;
    color: rgba(167,139,250,0.55);
  }

  /* Rodapé */
  .footer {
    position: absolute;
    bottom: 90px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 10;
  }

  .arroba {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 500;
    color: rgba(167,139,250,0.55);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="accent-line"></div>

  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">Evolua</span>
  </div>

  <div class="content">
    <div class="badge">novo post</div>
    <h1 class="titulo">{{TITULO}}</h1>
    <p class="corpo">{{CORPO}}</p>
    <div class="swipe-hint">
      <span class="swipe-text">arrasta pra ver</span>
      <span class="swipe-arrow">→</span>
    </div>
  </div>

  <div class="footer">
    <span class="arroba">{{ARROBA}}</span>
  </div>
</body>
</html>
