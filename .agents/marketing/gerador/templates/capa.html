<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #2D2B55;
    color: #F8F8FF;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Fundo violet com glow sutil */
  .bg {
    position: absolute;
    inset: 0;
    background: #2D2B55;
  }

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 85% 15%, rgba(124,58,237,0.30) 0%, transparent 55%);
  }

  /* Linha violet lateral esquerda */
  .accent-line {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: #6C63FF;
  }

  /* Logomark */
  .logomark {
    position: absolute;
    top: 52px;
    left: 60px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logomark-dot {
    width: 14px;
    height: 14px;
    background: #6C63FF;
  }

  .logomark-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #9D97F5;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Conteúdo central */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 64px;
    flex: 1;
    margin-top: 80px;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #6C63FF;
    color: #F8F8FF;
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 8px 20px;
    border-radius: 2px;
    margin-bottom: 44px;
    width: fit-content;
    border: 1px solid #6C63FF;
  }

  /* Título principal */
  .titulo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 80px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -2.5px;
    color: #F8F8FF;
    margin-bottom: 32px;
    max-width: 920px;
  }

  /* Subtítulo */
  .subtitulo {
    font-family: 'DM Sans', sans-serif;
    font-size: 30px;
    font-weight: 400;
    line-height: 1.55;
    color: rgba(167,139,250,0.80);
    max-width: 780px;
  }

  /* Rodapé */
  .footer {
    position: absolute;
    bottom: 48px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .arroba {
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 500;
    color: rgba(167,139,250,0.70);
    letter-spacing: 0.5px;
  }

  .slide-num {
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: rgba(245,240,255,0.35);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="accent-line"></div>

  <div class="logomark">
    <div class="logomark-dot"></div>
    <span class="logomark-text">Evolua</span>
  </div>

  <div class="content">
    <div class="badge">{{BADGE}}</div>
    <h1 class="titulo">{{TITULO}}</h1>
    <p class="subtitulo">{{SUBTITULO}}</p>
  </div>

  <div class="footer">
    <span class="arroba">{{ARROBA}}</span>
    <span class="slide-num">{{NUMERO}} / {{TOTAL}}</span>
  </div>
</body>
</html>
