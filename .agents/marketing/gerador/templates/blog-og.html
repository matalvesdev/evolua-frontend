<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #2D2B55;
    display: flex;
    flex-direction: row;
    position: relative;
  }

  /* Glow de fundo */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(124,58,237,0.25) 0%, transparent 55%);
    pointer-events: none;
  }

  /* Faixa violet lateral esquerda */
  .accent-line {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 8px;
    background: #6C63FF;
  }

  /* Metade esquerda — texto */
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 52px 48px 52px 72px;
    position: relative;
    z-index: 10;
  }

  /* Logo */
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 12px;
    height: 12px;
    background: #6C63FF;
  }

  .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #9D97F5;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Conteúdo central */
  .center-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }

  /* Chip de categoria */
  .chip {
    display: inline-flex;
    background: #6C63FF;
    color: #F8F8FF;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 2px;
    width: fit-content;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    border: 1px solid #6C63FF;
  }

  /* Título */
  .titulo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 44px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1.5px;
    color: #F8F8FF;
    max-width: 560px;
  }

  /* Subtítulo / descrição */
  .subtitulo {
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.55;
    color: rgba(167,139,250,0.75);
    max-width: 540px;
  }

  /* Rodapé esquerdo */
  .footer-left {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .arroba {
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: rgba(167,139,250,0.55);
  }

  .leia-mais {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #C4F135;
    letter-spacing: 0.5px;
  }

  /* Metade direita — painel violet */
  .right {
    width: 380px;
    background: linear-gradient(160deg, #5650D4 0%, #6C63FF 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 48px 40px;
    flex-shrink: 0;
    position: relative;
  }

  /* Texto grande decorativo */
  .right-big {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 96px;
    font-weight: 900;
    color: #F8F8FF;
    line-height: 0.9;
    letter-spacing: -4px;
    text-align: center;
    opacity: 0.08;
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* CTA no painel direito */
  .right-content {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .right-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: rgba(245,240,255,0.70);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .right-cta {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: #F8F8FF;
    line-height: 1.2;
    letter-spacing: -0.5px;
    text-align: center;
    max-width: 280px;
  }

  .right-url {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: rgba(196,241,53,0.75);
  }
</style>
</head>
<body>
  <div class="accent-line"></div>

  <div class="left">
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">Evolua</span>
    </div>

    <div class="center-content">
      <div class="chip">{{CATEGORIA}}</div>
      <h1 class="titulo">{{TITULO}}</h1>
      <p class="subtitulo">{{SUBTITULO}}</p>
    </div>

    <div class="footer-left">
      <span class="arroba">{{ARROBA}}</span>
      <span class="leia-mais">Leia no blog →</span>
    </div>
  </div>

  <div class="right">
    <div class="right-big">E</div>
    <div class="right-content">
      <span class="right-label">Gestão clínica</span>
      <p class="right-cta">Para fonoaudiólogas que querem escalar</p>
      <span class="right-url">useevolua.com.br</span>
    </div>
  </div>
</body>
</html>
