<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #2D2B55;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Glow radial */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(124,58,237,0.28) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Faixa violet no topo */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: #6C63FF;
  }

  /* Logo */
  .logo {
    position: absolute;
    top: 80px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    z-index: 10;
  }

  .logo-dot { width: 14px; height: 14px; background: #6C63FF; }

  .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #9D97F5;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Conteúdo */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 80px;
    width: 100%;
    gap: 52px;
    margin-top: 60px;
  }

  .titulo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 92px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -3px;
    color: #F8F8FF;
    max-width: 900px;
  }

  .corpo {
    font-family: 'DM Sans', sans-serif;
    font-size: 42px;
    font-weight: 400;
    line-height: 1.5;
    color: rgba(167,139,250,0.80);
    max-width: 860px;
  }

  /* Botão CTA — neon para máximo contraste */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: #C4F135;
    color: #1A1A2E;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 800;
    padding: 28px 64px;
    border-radius: 2px;
    letter-spacing: -0.5px;
  }

  .nota {
    font-family: 'DM Sans', sans-serif;
    font-size: 26px;
    font-weight: 400;
    color: rgba(167,139,250,0.40);
  }

  /* Rodapé */
  .footer {
    position: absolute;
    bottom: 80px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 10;
  }

  .arroba {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 500;
    color: rgba(167,139,250,0.40);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>

  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">Evolua</span>
  </div>

  <div class="content">
    <h2 class="titulo">{{TITULO}}</h2>
    <p class="corpo">{{CORPO}}</p>
    <div class="btn">
      <span>Testar grátis</span>
      <span>→</span>
    </div>
    <span class="nota">useevolua.com.br</span>
  </div>

  <div class="footer">
    <span class="arroba">{{ARROBA}}</span>
  </div>
</body>
</html>
